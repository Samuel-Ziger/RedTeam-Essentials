name: Local Study Application

on:
  push:
    paths:
      - '*.md'
      - '**/*.md'
      - 'MODULE-CATALOG.json'
      - 'STUDY-CONTENT.json'
      - '[0-4][0-9]-*/**'
      - 'lib/**'
      - 'report/**'
      - 'requirements-*.txt'
      - 'rte.py'
      - 'validate_scripts.ps1'
      - 'study-app/**'
      - 'estudo.sh'
      - 'scripts/validate_study_app.py'
      - '.gitignore'
      - '.github/workflows/study-app.yml'
  pull_request:
    paths:
      - '*.md'
      - '**/*.md'
      - 'MODULE-CATALOG.json'
      - 'STUDY-CONTENT.json'
      - '[0-4][0-9]-*/**'
      - 'lib/**'
      - 'report/**'
      - 'requirements-*.txt'
      - 'rte.py'
      - 'validate_scripts.ps1'
      - 'study-app/**'
      - 'estudo.sh'
      - 'scripts/validate_study_app.py'
      - '.gitignore'
      - '.github/workflows/study-app.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: study-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.12.0'
          cache: npm
          cache-dependency-path: study-app/package-lock.json

      - name: Validate the offline integration contract
        run: |
          python3 scripts/validate_study_app.py
          bash estudo.sh --check

      - name: Test and generate the Markdown catalog
        run: |
          python3 -m unittest discover -s study-app/scripts/tests -p 'test_*.py' -v
          python3 study-app/scripts/build_catalog.py --repo-root "$PWD"

      - name: Install locked frontend dependencies
        working-directory: study-app
        run: npm ci --ignore-scripts

      - name: Test the application
        working-directory: study-app
        run: npm test

      - name: Build the production bundle
        working-directory: study-app
        run: npm run build

      - name: Verify the bundle entry point
        run: test -f study-app/dist/index.html
