name: Privacy, VPN and Defensive Attribution Courses

on:
  push:
    paths:
      - '23-Threat-Intel-Emulation/privacidade-anonimato-fundamentos/**'
      - '24-Lateral-Movement/vpn-propria-operacao-segura/**'
      - '25-Cursos/atribuicao-defensiva/**'
      - 'scripts/validate_privacy_courses.py'
      - '.github/workflows/privacy-courses.yml'
  pull_request:
    paths:
      - '23-Threat-Intel-Emulation/privacidade-anonimato-fundamentos/**'
      - '24-Lateral-Movement/vpn-propria-operacao-segura/**'
      - '25-Cursos/atribuicao-defensiva/**'
      - 'scripts/validate_privacy_courses.py'

permissions:
  contents: read

concurrency:
  group: privacy-courses-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'

      - name: Install lint tool
        run: python -m pip install ruff==0.13.2

      - name: Lint and format-check course code
        run: |
          ruff check scripts/validate_privacy_courses.py \
            23-Threat-Intel-Emulation/privacidade-anonimato-fundamentos/exemplos \
            24-Lateral-Movement/vpn-propria-operacao-segura/exemplos \
            25-Cursos/atribuicao-defensiva/exemplos
          ruff format --check scripts/validate_privacy_courses.py \
            23-Threat-Intel-Emulation/privacidade-anonimato-fundamentos/exemplos \
            24-Lateral-Movement/vpn-propria-operacao-segura/exemplos \
            25-Cursos/atribuicao-defensiva/exemplos

      - name: Validate structure and safe scope
        run: python scripts/validate_privacy_courses.py

      - name: Run all three courses
        run: |
          bash 23-Threat-Intel-Emulation/privacidade-anonimato-fundamentos/testar-curso.sh
          bash 24-Lateral-Movement/vpn-propria-operacao-segura/testar-curso.sh
          bash 25-Cursos/atribuicao-defensiva/testar-curso.sh

      - name: Parse Bash scripts
        run: |
          find 23-Threat-Intel-Emulation/privacidade-anonimato-fundamentos \
            24-Lateral-Movement/vpn-propria-operacao-segura \
            25-Cursos/atribuicao-defensiva \
            -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n
