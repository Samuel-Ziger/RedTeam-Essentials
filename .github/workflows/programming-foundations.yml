name: Programming Foundations

on:
  push:
    paths:
      - '00-Fundamentos/programacao/**'
      - '.github/workflows/programming-foundations.yml'
  pull_request:
    paths:
      - '00-Fundamentos/programacao/**'
      - '.github/workflows/programming-foundations.yml'

permissions:
  contents: read

concurrency:
  group: programming-foundations-${{ github.ref }}
  cancel-in-progress: true

jobs:
  examples:
    name: Python, Java, C, C# and JavaScript
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'

      - name: Execute every course example
        run: bash 00-Fundamentos/programacao/testar-curso.sh --require-all
