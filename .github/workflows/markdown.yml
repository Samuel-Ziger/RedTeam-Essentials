name: Markdown Quality

on:
  push:
    paths:
      - '**/*.md'
      - '.github/workflows/markdown.yml'
      - '.markdownlint.json'
  pull_request:
    paths:
      - '**/*.md'

jobs:
  lint:
    name: markdownlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: DavidAnson/markdownlint-cli2-action@v16
        with:
          globs: |
            **/*.md
            !**/node_modules/**

  links:
    name: Link Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lychee link checker
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --max-concurrency 5 --accept 200,206,429,403 './**/*.md'
          fail: false
