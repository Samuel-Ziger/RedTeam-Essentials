name: Professional automation course

on:
  push:
    paths:
      - "04-Automation/automacao-profissional/**"
      - "04-Automation/README.md"
      - "MODULE-CATALOG.json"
      - "STUDY-CONTENT.json"
      - "study-app/scripts/build_catalog.py"
      - "study-app/scripts/tests/test_module04_curriculum.py"
      - ".github/workflows/professional-automation-course.yml"
  pull_request:
    paths:
      - "04-Automation/automacao-profissional/**"
      - "04-Automation/README.md"
      - "MODULE-CATALOG.json"
      - "STUDY-CONTENT.json"
      - "study-app/scripts/build_catalog.py"
      - "study-app/scripts/tests/test_module04_curriculum.py"
      - ".github/workflows/professional-automation-course.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: professional-automation-course-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"

      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"

      - name: Set up .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: "10.0.x"

      - name: Install Python quality tool
        run: python -m pip install --disable-pip-version-check ruff==0.13.2

      - name: Validate course examples and FileFlow
        run: bash 04-Automation/automacao-profissional/testar-curso.sh

      - name: Validate curriculum route and lab gates
        run: python -m unittest study-app/scripts/tests/test_module04_curriculum.py -v

