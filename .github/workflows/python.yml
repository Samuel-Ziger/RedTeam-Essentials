name: Python Lint & Compile

on:
  push:
    paths:
      - '**/*.py'
      - '.github/workflows/python.yml'
  pull_request:
    paths:
      - '**/*.py'

jobs:
  ruff-and-compile:
    name: Ruff + py_compile
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install tooling
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Ruff check
        run: ruff check 11-Python-Tools lib/python

      - name: Ruff format check
        run: ruff format --check 11-Python-Tools lib/python

      - name: Compile all Python files
        run: |
          python -m compileall -q 11-Python-Tools lib/python
          echo "Compilou sem erros."
