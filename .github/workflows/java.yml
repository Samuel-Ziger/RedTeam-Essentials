name: Java Build

on:
  push:
    paths:
      - '12-Java-Tools/**'
      - '.github/workflows/java.yml'
  pull_request:
    paths:
      - '12-Java-Tools/**'

jobs:
  javac:
    name: Compile (JDK 17)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Compile
        working-directory: 12-Java-Tools
        run: |
          mkdir -p build
          find src/main/java -name '*.java' > sources.txt
          javac -Xlint:all -Werror -d build @sources.txt
          echo "Compilou com sucesso."

      - name: Smoke test (PayloadGenerator --list)
        working-directory: 12-Java-Tools
        run: java -cp build io.redteam.essentials.PayloadGenerator --list
