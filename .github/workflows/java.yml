name: Java Build

on:
  push:
    paths:
      - '28-Engenharia-Ferramentas-Seguranca/acervo/java/**'
      - 'tests/java/**'
      - '.github/workflows/java.yml'
  pull_request:
    paths:
      - '28-Engenharia-Ferramentas-Seguranca/acervo/java/**'
      - 'tests/java/**'

permissions:
  contents: read

concurrency:
  group: java-${{ github.ref }}
  cancel-in-progress: true

jobs:
  javac:
    name: Compile (JDK 17)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Compile
        working-directory: 28-Engenharia-Ferramentas-Seguranca/acervo/java
        run: |
          mkdir -p build
          find src/main/java -name '*.java' > sources.txt
          javac -Xlint:all -Werror -d build @sources.txt
          echo "Compilou com sucesso."

      - name: Smoke test (PayloadGenerator --list)
        working-directory: 28-Engenharia-Ferramentas-Seguranca/acervo/java
        run: java -cp build io.redteam.essentials.PayloadGenerator --list

      - name: Offline behavior tests
        run: bash tests/java/test_payload_generator.sh
