name: Advanced Data and API Course

on:
  push:
    paths:
      - '01-Recon/README.md'
      - '01-Recon/programacao-avancada/**'
      - 'MODULE-CATALOG.json'
      - 'STUDY-CONTENT.json'
      - 'study-app/scripts/build_catalog.py'
      - 'study-app/scripts/tests/test_module01_curriculum.py'
      - '.github/workflows/advanced-data-api.yml'
  pull_request:
    paths:
      - '01-Recon/README.md'
      - '01-Recon/programacao-avancada/**'
      - 'MODULE-CATALOG.json'
      - 'STUDY-CONTENT.json'
      - 'study-app/scripts/build_catalog.py'
      - 'study-app/scripts/tests/test_module01_curriculum.py'
      - '.github/workflows/advanced-data-api.yml'

permissions:
  contents: read

concurrency:
  group: advanced-data-api-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit, contract and static checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'

      - name: Install pinned dependencies
        working-directory: 01-Recon/programacao-avancada/projetos/inventory-api/api
        run: python -m pip install --requirement requirements-dev.txt ruff==0.13.2

      - name: Ruff
        run: |
          ruff check 01-Recon/programacao-avancada/projetos/inventory-api/api
          ruff format --check 01-Recon/programacao-avancada/projetos/inventory-api/api

      - name: Course checks
        run: bash 01-Recon/programacao-avancada/testar-curso.sh --require-all

      - name: Curriculum integration
        run: python -m unittest study-app/scripts/tests/test_module01_curriculum.py -v

  integration:
    name: PostgreSQL, MongoDB, outbox and gateway
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Build and start the complete API
        working-directory: 01-Recon/programacao-avancada/projetos/inventory-api
        run: docker compose up --build --detach --wait

      - name: End-to-end smoke test
        working-directory: 01-Recon/programacao-avancada/projetos/inventory-api
        run: bash smoke-test.sh

      - name: Show diagnostics after failure
        if: failure()
        working-directory: 01-Recon/programacao-avancada/projetos/inventory-api
        run: docker compose ps && docker compose logs --no-color

      - name: Cleanup
        if: always()
        working-directory: 01-Recon/programacao-avancada/projetos/inventory-api
        run: docker compose down --volumes
