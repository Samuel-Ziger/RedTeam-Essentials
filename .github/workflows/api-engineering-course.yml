name: API engineering course

on:
  push:
    paths:
      - "05-DFIR/engenharia-apis/**"
      - "05-DFIR/README.md"
      - "MODULE-CATALOG.json"
      - "STUDY-CONTENT.json"
      - "study-app/scripts/build_catalog.py"
      - "study-app/scripts/tests/test_module05_curriculum.py"
      - ".github/workflows/api-engineering-course.yml"
  pull_request:
    paths:
      - "05-DFIR/engenharia-apis/**"
      - "05-DFIR/README.md"
      - "MODULE-CATALOG.json"
      - "STUDY-CONTENT.json"
      - "study-app/scripts/build_catalog.py"
      - "study-app/scripts/tests/test_module05_curriculum.py"
      - ".github/workflows/api-engineering-course.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: api-engineering-course-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"

      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"

      - name: Set up .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: "10.0.x"

      - name: Install course dependencies
        run: >-
          python -m pip install --disable-pip-version-check
          -r 05-DFIR/engenharia-apis/projetos/contract-lab-api/requirements-dev.txt

      - name: Validate examples and Contract Lab
        run: bash 05-DFIR/engenharia-apis/testar-curso.sh

      - name: Validate curriculum route and lab gates
        run: python -m unittest study-app/scripts/tests/test_module05_curriculum.py -v
