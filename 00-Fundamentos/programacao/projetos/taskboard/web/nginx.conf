worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr notice;

events {
    worker_connections 256;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    charset utf-8;

    log_format taskboard escape=json
        '{"time":"$time_iso8601",'
        '"requestId":"$request_id",'
        '"remote":"$remote_addr",'
        '"method":"$request_method",'
        '"path":"$uri",'
        '"status":$status,'
        '"bytes":$body_bytes_sent,'
        '"duration":$request_time,'
        '"upstreamStatus":"$upstream_status"}';
    access_log /dev/stdout taskboard;

    server_tokens off;
    sendfile on;
    etag on;
    keepalive_timeout 30s;
    client_header_timeout 10s;
    client_body_timeout 10s;
    send_timeout 10s;
    client_max_body_size 16k;
    large_client_header_buffers 2 8k;
    proxy_intercept_errors on;

    # A variável faz o Nginx consultar novamente o DNS interno quando o
    # container da API for recriado e receber outro endereço.
    resolver 127.0.0.11 ipv6=off valid=10s;
    resolver_timeout 2s;

    # Todos os caminhos temporários ficam no tmpfs declarado no Compose.
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    add_header Cache-Control "no-store" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; connect-src 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=()" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;
        autoindex off;

        # O gateway é o dono destes cabeçalhos na resposta externa. Ocultar
        # os equivalentes do upstream evita campos duplicados no proxy.
        proxy_hide_header Server;
        proxy_hide_header Cache-Control;
        proxy_hide_header X-Content-Type-Options;

        error_page 413 = @payload_too_large;
        error_page 502 504 = @api_unavailable;

        # Liveness do gateway: não depende da API.
        location = /health {
            access_log off;
            return 204;
        }

        # Probes da API atravessam o proxy e testam outra fronteira.
        location = /api/health {
            set $api_upstream http://api:8000;
            proxy_pass $api_upstream/health;
            proxy_http_version 1.1;
            proxy_connect_timeout 3s;
            proxy_read_timeout 10s;
            proxy_send_timeout 10s;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
        }

        location = /api/ready {
            set $api_upstream http://api:8000;
            proxy_pass $api_upstream/ready;
            proxy_http_version 1.1;
            proxy_connect_timeout 3s;
            proxy_read_timeout 10s;
            proxy_send_timeout 10s;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
        }

        location = /api {
            default_type application/json;
            return 404 '{"error":{"code":"route_not_found","message":"rota não encontrada","requestId":"$request_id"}}';
        }

        location /api/ {
            set $api_upstream http://api:8000;
            proxy_pass $api_upstream;
            proxy_http_version 1.1;
            proxy_connect_timeout 3s;
            proxy_read_timeout 10s;
            proxy_send_timeout 10s;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            # Este gateway é a borda do laboratório; ele substitui, em vez de
            # confiar em, um X-Forwarded-For fornecido pelo cliente.
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
        }

        location @payload_too_large {
            default_type application/json;
            return 413 '{"error":{"code":"payload_too_large","message":"corpo excede 16384 bytes","requestId":"$request_id"}}';
        }

        location @api_unavailable {
            default_type application/json;
            return 503 '{"error":{"code":"api_unavailable","message":"API temporariamente indisponível","requestId":"$request_id"}}';
        }

        # Arquivos ocultos nunca fazem parte da interface publicada.
        location ~ (^|/)\. {
            return 404;
        }

        # O mime.types da imagem Alpine não declara necessariamente .mjs.
        # Com nosniff ativo, o navegador recusaria o módulo se ele fosse
        # entregue como application/octet-stream.
        location = /taskboard-core.mjs {
            default_type application/javascript;
            try_files $uri =404;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
