services:
  postgres:
    image: postgres:18.6-alpine3.23@sha256:885cf05d376c7cf27afef02073e6bdac3841252537f16e244fd1c1e6a7c99fb1
    environment:
      POSTGRES_DB: inventory
      POSTGRES_USER: inventory
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./db/postgres:/docker-entrypoint-initdb.d:ro
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inventory -d inventory"]
      interval: 5s
      timeout: 3s
      retries: 12
    read_only: true
    tmpfs:
      - /tmp
      - /run/postgresql
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: 0.75
    restart: "no"

  mongo:
    image: mongo:8.3.11-noble@sha256:02eb14a1130c6d060847c4169eccd4d79d9f172a584da7aea8f160c492537b02
    command: ["mongod", "--bind_ip_all", "--quiet"]
    environment:
      MONGO_INITDB_DATABASE: inventory
    volumes:
      - mongo-data:/data/db
      - mongo-config:/data/configdb
      - ./db/mongo:/docker-entrypoint-initdb.d:ro
    networks:
      - data
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 3s
      retries: 12
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: 0.75
    restart: "no"

  api:
    build:
      context: ./api
    environment:
      POSTGRES_DSN: postgresql://inventory@postgres:5432/inventory
      MONGO_URI: mongodb://mongo:27017
      MONGO_DATABASE: inventory
      DB_POOL_MIN: 1
      DB_POOL_MAX: 5
      OUTBOX_INTERVAL_SECONDS: 0.25
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
    networks:
      - data
      - service
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 12
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: 0.50
    restart: "no"

  gateway:
    build:
      context: ./gateway
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${INVENTORY_PORT:-8101}:8080"
    networks:
      - service
      - access
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/gateway-health"]
      interval: 5s
      timeout: 3s
      retries: 12
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    cpus: 0.25
    restart: "no"

networks:
  data:
    internal: true
  service:
    internal: true
  access:
    internal: false

volumes:
  postgres-data:
  mongo-data:
  mongo-config:
