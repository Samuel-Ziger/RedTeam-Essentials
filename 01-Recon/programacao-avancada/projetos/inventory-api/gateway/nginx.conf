worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr notice;

events {
    worker_connections 256;
}

http {
    include /etc/nginx/mime.types;
    default_type application/json;
    access_log /dev/stdout;
    server_tokens off;
    resolver 127.0.0.11 ipv6=off valid=10s;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    client_max_body_size 32k;

    limit_req_zone $binary_remote_addr zone=api_per_ip:1m rate=20r/s;
    limit_req_status 429;

    map $http_x_request_id $correlation_id {
        "~^[A-Za-z0-9_-]{8,64}$" $http_x_request_id;
        default $request_id;
    }

    server {
        listen 8080;
        add_header X-Request-ID $correlation_id always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "no-store" always;

        location = /gateway-health {
            access_log off;
            return 204;
        }

        location / {
            limit_req zone=api_per_ip burst=40 nodelay;
            set $api_upstream http://api:8000;
            proxy_pass $api_upstream;
            proxy_http_version 1.1;
            proxy_connect_timeout 3s;
            proxy_read_timeout 15s;
            proxy_send_timeout 10s;
            proxy_set_header Host $host;
            proxy_set_header X-Request-ID $correlation_id;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_hide_header X-Request-ID;
            proxy_hide_header X-Content-Type-Options;
            proxy_hide_header Cache-Control;
        }
    }
}
