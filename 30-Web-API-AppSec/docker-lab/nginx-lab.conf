# Gateway local do laboratório do Módulo 30.
worker_processes auto;
pid /var/run/nginx.pid;

events {
    worker_connections 256;
}

http {
    resolver 127.0.0.11 ipv6=off valid=10s;
    access_log off;
    server_tokens off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    server {
        listen 8090;
        location = /health {
            access_log off;
            return 204;
        }
    }

    server {
        listen 8081;
        set $backend http://dvwa:80;
        location / { proxy_pass $backend; include /etc/nginx/proxy_params; }
    }

    server {
        listen 8082;
        set $backend http://juiceshop:3000;
        location / { proxy_pass $backend; include /etc/nginx/proxy_params; }
    }

    server {
        listen 8083;
        set $backend http://bwapp:80;
        location / { proxy_pass $backend; include /etc/nginx/proxy_params; }
    }

    server {
        listen 8084;
        set $backend http://webgoat:8080;
        location / { proxy_pass $backend; include /etc/nginx/proxy_params; }
    }

    server {
        listen 8087;
        set $backend http://vampi:5000;
        location / { proxy_pass $backend; include /etc/nginx/proxy_params; }
    }

    server {
        listen 9090;
        set $backend http://webgoat:9090;
        location / { proxy_pass $backend; include /etc/nginx/proxy_params; }
    }
}
